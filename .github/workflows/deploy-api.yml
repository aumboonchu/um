name: Deploy API

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target Worker environment
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: smartcart-api-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TARGET: ${{ inputs.target }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Worker binding types
        working-directory: apps/api
        run: npx wrangler types src/env.d.ts
      - name: Verify generated Worker binding types
        run: npm run types:check --workspace=@smartcart/api
      - name: Apply D1 migrations
        working-directory: apps/api
        run: npx wrangler d1 migrations apply "smartcart-${TARGET}" --remote --env "${TARGET}"
      - name: Deploy Worker
        working-directory: apps/api
        run: npx wrangler deploy --env "${TARGET}"

